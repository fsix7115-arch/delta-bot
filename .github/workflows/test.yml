name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (no-lookahead property)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Engine + lookahead tests
        # These two suites are the ones that matter. They assert the property
        # the rest of the repo exists to protect: that a signal can only ever
        # act on data available at its own timestamp. If they fail, no Sharpe
        # number in this repository means anything.
        #
        # The other test_*.py files hit live APIs or full multi-year sweeps and
        # are not run here.
        run: python3 -m pytest test_engine.py test_lookahead.py -v
